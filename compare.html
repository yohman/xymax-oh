<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東京物語 - Compare Mode</title>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <style>
        body {
            background: #000;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 50/50 Layout Containers */
        .map-container {
            width: 50%;
            height: 100vh;
            position: relative;
        }
        
        .map-header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .back-arrow {
            color: #fff;
            font-size: 1.8rem;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s ease;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .back-arrow:hover {
            opacity: 0.7;
        }
        
        .compare-title {
            font-family: 'Noto Serif JP', serif;
            font-size: 1.5rem;
            font-weight: 900;
            margin: 0;
            color: #fff;
            letter-spacing: 0.1em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .data-container {
            width: 50%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            border-left: 1px solid #333;
            overflow-y: auto;
            padding: 20px;
        }
        
        #map {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
        }

        /* Background satellite map */
        .background-map {
            position: fixed;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            z-index: 1;
            background: url('https://api.mapbox.com/styles/v1/mapbox/satellite-v9/static/139.6917,35.6895,10/1920x1080?access_token=pk.eyJ1IjoieW9obWFuIiwiYSI6IkxuRThfNFkifQ.u2xRJMiChx914U7mOZMiZw') center/cover no-repeat;
            opacity: 0.3;
            pointer-events: none; /* Allow mouse events to pass through to the map */
        }

        .compare-title {
            font-family: 'Noto Serif JP', serif;
            font-size: 1.5rem;
            font-weight: 900;
            margin: 0;
            color: #fff;
            letter-spacing: 0.1em;
        }

        .data-panel-content {
            max-width: 100%;
        }

        .area-comparison {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .area-header {
            margin-bottom: 15px;
        }

        .area-dropdown {
            width: 100%;
            padding: 8px 12px;
            background: rgba(26, 26, 26, 0.9);
            border: 1px solid #555;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease;
            margin-bottom: 10px;
        }

        .area-dropdown:focus {
            border-color: #999;
        }

        .area1-dropdown {
            border-left: 4px solid #8b5cf6;
        }

        .area2-dropdown {
            border-left: 4px solid #06b6d4;
        }

        .dropdown-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .dropdown-container .area-dropdown {
            margin-bottom: 0;
            flex: 1;
        }

        .single-mode-link {
            color: #aaa;
            text-decoration: none;
            font-size: 1.2rem;
            padding: 5px 8px;
            border-radius: 3px;
            transition: all 0.2s ease;
            opacity: 0.7;
        }

        .single-mode-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            opacity: 1;
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .comparison-item {
            background: rgba(26, 26, 26, 0.8);
            border: 1px solid #333;
            padding: 15px;
            text-align: center;
            backdrop-filter: blur(5px);
        }

                .comparison-box-area1 {
            border: 3px solid #8b5cf6;
            background: rgba(139, 92, 246, 0.05);
        }
        
        .comparison-box-area2 {
            border: 3px solid #06b6d4;
            background: rgba(6, 182, 212, 0.05);
        }

        .comparison-category {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 5px;
        }

        .comparison-value {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 5px;
            color: #fff;
        }

        .comparison-difference {
            font-size: 0.8rem;
            padding: 3px 8px;
            font-weight: 500;
        }

        .difference-positive {
            background: rgba(46, 125, 50, 0.3);
            color: #81c784;
        }

        .difference-negative {
            background: rgba(198, 40, 40, 0.3);
            color: #ef5350;
        }

        .back-button {
            padding: 8px 16px;
            background: rgba(60, 60, 60, 0.8);
            border: 1px solid #555;
            color: #fff;
            text-decoration: none;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .back-button:hover {
            background: rgba(80, 80, 80, 0.9);
            border-color: #666;
        }        /* Sankey Diagram Styles */
        .sankey-section {
            margin-bottom: 15px;
            background: rgba(26, 26, 26, 0.8);
            border: 1px solid #333;
            padding: 15px;
            backdrop-filter: blur(5px);
        }
        
        .sankey-container {
            color: #fff;
            width: 100%;
        }
        
        #sankey-chart {
            width: 100%;
            height: 320px;
            margin-top: 5px;
            margin-bottom: 0;
            overflow: visible;
            display: flex;
            justify-content: center;
        }
        
        .sankey-node {
            cursor: pointer;
        }
        
        .sankey-link {
            fill: none;
            stroke-opacity: 0.6;
        }
        
        .sankey-node-text {
            font-size: 0.7em;
            font-weight: 500;
            fill: #fff;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        
        .sankey-value-text {
            font-size: 0.6em;
            font-weight: bold;
            fill: #fff;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        .chart-toggle {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .toggle-label input[type="radio"] {
            accent-color: #999;
        }

        .bar-charts {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chart-item {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chart-title {
            font-size: 1rem;
            font-weight: 500;
            color: #fff;
            text-align: center;
        }

        .chart-bars {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chart-bar {
            position: relative;
            height: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            display: flex;
            align-items: center;
        }

        .chart-bar.area1-bar {
            border-left: 3px solid #ff9800;
        }

        .chart-bar.area2-bar {
            border-left: 3px solid #2196f3;
        }

        .bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
            position: relative;
        }

        .area1-bar .bar-fill {
            background: linear-gradient(90deg, rgba(255, 152, 0, 0.7) 0%, rgba(255, 152, 0, 0.9) 100%);
        }

        .area2-bar .bar-fill {
            background: linear-gradient(90deg, rgba(33, 150, 243, 0.7) 0%, rgba(33, 150, 243, 0.9) 100%);
        }

        .bar-label {
            position: absolute;
            right: 10px;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 2;
        }
    </style>
</head>
<body>
    <!-- Map Container (50% width) -->
    <div class="map-container">
            <!-- Basemap selector at bottom left of map panel -->
            <div class="basemap-toggle" style="position: absolute; bottom: 24px; left: 24px; z-index: 1200; background: rgba(26,26,26,0.85); border: 1px solid #333; border-radius: 6px; padding: 8px 12px;">
                <label for="basemap-select" style="color:#fff; margin-right:8px;">地図:</label>
                <select id="basemap-select" style="padding:4px 8px;">
                    <option value="satellite">衛星写真</option>
                    <option value="gsi">国土地理院</option>
                </select>
            </div>
        <!-- Background satellite map -->
        <div class="background-map"></div>
        
        <div id="map"></div>
        
        <div class="map-header">
            <a href="index.html" class="back-arrow">←</a>
            <h1 class="compare-title">東京物語</h1>
        </div>
    </div>
    
    <!-- Data Container (50% width) -->
    <div class="data-container">
        <div class="data-panel-content">
                
                <!-- Area Comparison Section -->
                <div class="area-comparison">
                    <div class="dropdown-container">
                        <select class="area-dropdown area1-dropdown" id="area1-select">
                            <option value="">エリア1を選択</option>
                        </select>
                        <a href="single.html" class="single-mode-link" id="area1-link" style="display: none;" title="シングルモードで表示">→</a>
                    </div>
                    <div class="dropdown-container">
                        <select class="area-dropdown area2-dropdown" id="area2-select">
                            <option value="">エリア2を選択</option>
                        </select>
                        <a href="single.html" class="single-mode-link" id="area2-link" style="display: none;" title="シングルモードで表示">→</a>
                    </div>
                </div>

                <!-- Sankey Diagram Section -->
                <div class="sankey-section" id="sankey-section" style="display: none;">
                    <div class="chart-toggle">
                        <label class="toggle-label">
                            <input type="radio" name="chart-mode" value="actual" checked>
                            実数
                        </label>
                        <label class="toggle-label">
                            <input type="radio" name="chart-mode" value="percentage">
                            パーセント
                        </label>
                    </div>
                    
                    <div class="sankey-container">
                        <!-- D3 Sankey Visualization -->
                        <div id="sankey-chart"></div>
                    </div>
                    
                    <!-- Summary Statement -->
                    <div id="comparison-summary" class="panel-summary-statement" style="margin-top: 20px; background: rgba(26, 26, 26, 0.95); color: #ffffff; font-weight: 400; border: 1px solid #444; backdrop-filter: blur(5px);"></div>
                </div>

                <!-- Population Comparison -->
                <div class="comparison-grid" id="population-comparison">
                    <div class="comparison-item area1">
                        <div class="comparison-category">人口</div>
                        <div class="comparison-value" id="area1-population">-</div>
                        <div class="comparison-difference" id="population-diff">-</div>
                    </div>
                    <div class="comparison-item area2">
                        <div class="comparison-category">人口</div>
                        <div class="comparison-value" id="area2-population">-</div>
                    </div>
                </div>

                <!-- Land Use Comparison -->
                <div class="comparison-grid" id="landuse-comparison">
                    <!-- Office Space -->
                    <div class="comparison-item area1">
                        <div class="comparison-category">オフィス面積 (2023)</div>
                        <div class="comparison-value" id="area1-office">-</div>
                        <div class="comparison-difference" id="office-diff">-</div>
                    </div>
                    <div class="comparison-item area2">
                        <div class="comparison-category">オフィス面積 (2023)</div>
                        <div class="comparison-value" id="area2-office">-</div>
                    </div>

                    <!-- Housing Space -->
                    <div class="comparison-item area1">
                        <div class="comparison-category">住宅面積 (2023)</div>
                        <div class="comparison-value" id="area1-housing">-</div>
                        <div class="comparison-difference" id="housing-diff">-</div>
                    </div>
                    <div class="comparison-item area2">
                        <div class="comparison-category">住宅面積 (2023)</div>
                        <div class="comparison-value" id="area2-housing">-</div>
                    </div>

                    <!-- Other Space -->
                    <div class="comparison-item area1">
                        <div class="comparison-category">その他面積 (2023)</div>
                        <div class="comparison-value" id="area1-other">-</div>
                        <div class="comparison-difference" id="other-diff">-</div>
                    </div>
                    <div class="comparison-item area2">
                        <div class="comparison-category">その他面積 (2023)</div>
                        <div class="comparison-value" id="area2-other">-</div>
                    </div>
                </div>
        </div>
    </div>
    
    <script src="js/settings.js"></script>
    <script src="js/compare.js?v=20251020d"></script>
</body>
</html>
