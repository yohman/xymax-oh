<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東京物語 - Mode Selection</title>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: #fff;
            overflow: auto;
        }

        /* Map container */
        #background-map {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Floating UI container */
        .floating-ui {
            position: relative;
            width: 100%;
            min-height: 100vh;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            box-sizing: border-box;
            pointer-events: auto;
        }

        .main-title {
            font-family: 'Noto Serif JP', serif;
            font-size: 6rem;
            font-weight: 900;
            margin-bottom: 4rem;
            color: #fff;
            letter-spacing: 0.1em;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            text-align: center;
            pointer-events: auto;
        }

        .mode-options {
            display: flex;
            gap: 2rem;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            box-sizing: border-box;
            pointer-events: auto;
        }

        .mode-box {
            flex: 0 0 340px;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            border-radius: 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 2rem 1.2rem 1.2rem 1.2rem;
            width: 340px;
            min-width: 340px;
            max-width: 340px;
            height: 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            transition: box-shadow 0.2s;
            cursor: pointer;
            box-sizing: border-box;
        }

        .mode-title {
            font-family: 'Noto Serif JP', serif;
            font-size: 1.8rem;
            font-weight: 400;
            margin-top: 0;
            margin-bottom: 0.8rem;
            color: #f5f5f5;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
            width: 100%;
            text-align: center;
            letter-spacing: 0.05em;
        }

        .mode-description {
            font-size: 1rem;
            margin-bottom: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.4;
            width: 100%;
            text-align: center;
        }

        .mode-controls {
            margin-top: auto;
            margin-bottom: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .area-dropdown {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 1rem;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
        }

        .area-dropdown:focus {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.8);
        }

        .start-discovery-btn {
            width: 100%;
            padding: 15px 30px;
            background: rgba(139, 92, 246, 0.3);
            border: 2px solid rgba(139, 92, 246, 0.5);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .start-discovery-btn:hover {
            background: rgba(139, 92, 246, 0.5);
            border-color: rgba(139, 92, 246, 0.8);
            transform: translateY(-1px);
        }

        .enter-button {
            width: 100%;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.6;
            pointer-events: none;
            backdrop-filter: blur(5px);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .enter-button.enabled {
            opacity: 1;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .enter-button.enabled:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .floating-ui {
                padding: 1rem;
                min-height: auto;
            }
            
            .mode-options {
                flex-direction: column;
                gap: 2rem;
                padding-bottom: 2rem;
            }
            
            .main-title {
                font-size: 3rem;
                margin-bottom: 2rem;
            }
            
            .mode-box {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Background Mapbox satellite map -->
    <div id="background-map"></div>
    
    <!-- Floating UI elements -->
    <div class="floating-ui">
        <h1 class="main-title">東京物語</h1>
        
        <div class="mode-options">
            <!-- Discovery Mode -->
            <div class="mode-box" id="discovery-mode">
                <h2 class="mode-title">Glide</h2>
                <p class="mode-description">グライド検索</p>
                <div class="mode-controls">
                    <button class="start-discovery-btn" onclick="window.location.href='discovery.html'">
                        開始
                    </button>
                </div>
            </div>

            <!-- Single Location Mode -->
            <div class="mode-box" id="single-mode">
                <h2 class="mode-title">Spotlight</h2>
                <p class="mode-description">一つのエリアにフォーカス</p>
                <div class="mode-controls">
                    <select id="single-area-dropdown" class="area-dropdown">
                        <option value="">エリア選択</option>
                        <!-- Options will be populated dynamically -->
                    </select>
                </div>
            </div>

            <!-- Compare Mode -->
            <div class="mode-box" id="compare-mode">
                <h2 class="mode-title">Mirror</h2>
                <p class="mode-description">２つのエリアを並べて比較</p>
                <div class="mode-controls">
                    <select id="compare-area1-dropdown" class="area-dropdown">
                        <option value="">エリア１</option>
                        <!-- Options will be populated dynamically -->
                    </select>
                    <select id="compare-area2-dropdown" class="area-dropdown">
                        <option value="">エリア２</option>
                        <!-- Options will be populated dynamically -->
                    </select>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Populate dropdowns with area names
        async function populateDropdowns() {
            try {
                const response = await fetch('data/salsa.geojson');
                const data = await response.json();
                const areaNames = Array.from(new Set(data.features.map(f => f.properties.AREA_NAME))).sort();
                
                const dropdowns = [
                    'single-area-dropdown',
                    'compare-area1-dropdown', 
                    'compare-area2-dropdown'
                ];
                
                dropdowns.forEach(dropdownId => {
                    const dropdown = document.getElementById(dropdownId);
                    if (dropdown) {
                        areaNames.forEach(name => {
                            const option = document.createElement('option');
                            option.value = name;
                            option.textContent = name;
                            dropdown.appendChild(option);
                        });
                    }
                });
            } catch (error) {
                console.error('Error loading area names:', error);
            }
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            populateDropdowns();
            
            // Single area dropdown - auto-navigate when selected
            document.getElementById('single-area-dropdown').addEventListener('change', (e) => {
                const selectedArea = e.target.value;
                if (selectedArea) {
                    // Navigate to single mode with selected area
                    window.location.href = `single.html?mode=single&area=${encodeURIComponent(selectedArea)}`;
                }
            });
            
            // Compare area dropdowns - auto-navigate when second area is selected
            let compareArea1 = '';
            
            document.getElementById('compare-area1-dropdown').addEventListener('change', (e) => {
                compareArea1 = e.target.value;
                // Reset second dropdown when first is changed
                if (compareArea1) {
                    document.getElementById('compare-area2-dropdown').value = '';
                }
            });
            
            document.getElementById('compare-area2-dropdown').addEventListener('change', (e) => {
                const compareArea2 = e.target.value;
                if (compareArea1 && compareArea2 && compareArea1 !== compareArea2) {
                    // Auto-navigate to compare mode with selected areas
                    window.location.href = `compare.html?area1=${encodeURIComponent(compareArea1)}&area2=${encodeURIComponent(compareArea2)}`;
                }
            });
        });
    </script>

    <script>
        // Initialize background satellite map
        mapboxgl.accessToken = 'pk.eyJ1IjoieW9obWFuIiwiYSI6IkxuRThfNFkifQ.u2xRJMiChx914U7mOZMiZw';
        
        const backgroundMap = new mapboxgl.Map({
            container: 'background-map',
            style: 'mapbox://styles/mapbox/satellite-v9',
            center: [139.6917, 35.6895], // Tokyo coordinates
            zoom: 10,
            pitch: 0,
            bearing: 0,
            interactive: false, // Disable map interactions since it's just a background
            attributionControl: false
        });
        
        // Disable all map interactions to keep it as pure background
        backgroundMap.scrollZoom.disable();
        backgroundMap.boxZoom.disable();
        backgroundMap.dragRotate.disable();
        backgroundMap.dragPan.disable();
        backgroundMap.keyboard.disable();
        backgroundMap.doubleClickZoom.disable();
        backgroundMap.touchZoomRotate.disable();
    </script>
</body>
</html>
